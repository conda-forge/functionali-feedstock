{% set name = "functionali" %}
{% set version = "0.3.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/functionali-{{ version }}.tar.gz
  sha256: 8c82b12590af2b1feba5ae2003efdb61a79a651ecf2c2f1f3b42491238e47267

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - poetry
    - python {{ python_min }}
  run:
    - python >={{ python_min }}

test:
  imports:
    - functionali
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/AbhinavOmprakash/functionali
  doc_url: https://functionali.readthedocs.io/en/latest/
  summary: Functional programming tools for python.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thewchan
